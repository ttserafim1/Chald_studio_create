<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chald Studio Create - Подача заявки</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            animation: fadeIn 1s ease-in;
        }
        .container {
            max-width: 90%;
            margin: 50px auto;
            background: rgba(40, 40, 40, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(0.9);
            animation: popIn 0.5s ease-out forwards;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.3s ease, background 0.3s;
            position: relative;
            overflow: hidden;
        }
        button:hover {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            transform: scale(1.1);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            transition: box-shadow 0.3s;
        }
        input:focus {
            box-shadow: 0 0 10px rgba(255, 75, 75, 0.8);
            outline: none;
        }
        .hidden { display: none; }
        .status-message {
            margin-top: 10px;
            color: #ff416c;
            font-size: 18px;
        }
        .version {
            position: fixed;
            left: 10px;
            bottom: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        .marquee {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            font-size: 18px;
            margin-top: 20px;
        }
        .marquee span {
            display: inline-block;
            animation: marquee 10s linear infinite;
        }
        @keyframes marquee {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <h1>Chald Studio Create</h1>
    <div class="container">
        <h2>Подача заявки</h2>
        <button onclick="toggleForm()">Подать заявку</button>
        <div class="marquee"><span>Наш Telegram: <a href="https://t.me/tt_serafim_1_family" target="_blank">https://t.me/tt_serafim_1_family</a></span></div>
        <div id="formContainer" class="hidden">
            <form id="applicationForm">
                <label>Ник: <input type="text" id="nickname" required></label>
                <label>Имя: <input type="text" id="name" required></label>
                <label>Возраст: <input type="number" id="age" required></label>
                <label>Ваш ник в Telegram (без @, с нижними подчёркиваниями): <input type="text" id="tgTag" required></label>
                <label>Дискорд: <input type="text" id="discord" required></label>
                <label>Опыт в Minecraft (лет): <input type="number" id="experience" required></label>
                <label>Вы играли в другие проекты? </label>
                <div>
                    <button type="button" onclick="selectOption('Нет')">Нет</button>
                    <button type="button" onclick="selectOption('Да')">Да</button>
                </div>
                <input type="hidden" id="pastProjects" value="Нет">
                <label>Какие моды вам интересны? <input type="text" id="favoriteMods"></label>
                <button type="submit">Отправить</button>
            </form>
            <p id="statusMessage" class="status-message"></p>
        </div>
    </div>
    <div class="version">Версия 1.1</div>
    <script>
        function toggleForm() {
            let form = document.getElementById('formContainer');
            form.classList.toggle('hidden');
        }
        function selectOption(value) {
            document.getElementById('pastProjects').value = value;
        }
        document.getElementById('applicationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let tgTag = document.getElementById('tgTag').value.replace(/_/g, '\\_');
            let message = `📩 *Новая заявка на Chald Studio Create*\n\n👤 *Ник:* ${document.getElementById('nickname').value}\n📛 *Имя:* ${document.getElementById('name').value}\n🎂 *Возраст:* ${document.getElementById('age').value}\n📱 *Telegram:* @${tgTag}\n🎧 *Discord:* ${document.getElementById('discord').value}\n🎮 *Опыт в Minecraft:* ${document.getElementById('experience').value} лет\n🏗 *Играл в другие проекты:* ${document.getElementById('pastProjects').value}\n⚙ *Интересные моды:* ${document.getElementById('favoriteMods').value}`;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: "6962439559", text: message, parse_mode: "MarkdownV2" })
            }).then(() => {
                document.getElementById('statusMessage').innerText = 'Заявка успешно отправлена!';
            }).catch(() => {
                document.getElementById('statusMessage').innerText = 'Ошибка отправки заявки!';
            });
        });
    </script>
</body>
</html>
