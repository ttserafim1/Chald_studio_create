<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chald Studio Create - Подача заявки</title>
    <style>
        body {
            background: #121212;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        button {
            background: #6200ea;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #3700b3;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Chald Studio Create</h1>
    <div class="container">
        <h2>Подача заявки</h2>
        <button onclick="toggleForm()">Подать заявку</button>
        <div id="formContainer" class="hidden">
            <form id="applicationForm">
                <label>Ник: <input type="text" id="nickname" required></label><br>
                <label>Имя: <input type="text" id="name" required></label><br>
                <label>Возраст: <input type="number" id="age" required></label><br>
                <label>Тег TG: <input type="text" id="tgTag" required></label><br>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
    <script>
        function toggleForm() {
            document.getElementById('formContainer').classList.toggle('hidden');
        }
        
        document.getElementById('applicationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let nickname = document.getElementById('nickname').value;
            let name = document.getElementById('name').value;
            let age = document.getElementById('age').value;
            let tgTag = document.getElementById('tgTag').value;
            
            let botToken = "7776157593:AAFaX3wQXT5gdSN2PgyklNe4NcLcArUuG8s";
            let chatId = "6962439559";
            let message = `📩 *Новая заявка на Chald Studio Create*\n\n👤 *Ник:* ${nickname}\n📛 *Имя:* ${name}\n🎂 *Возраст:* ${age}\n📱 *Telegram:* @${tgTag}`;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: "Markdown" })
            }).then(() => alert('Заявка отправлена!'));
        });
    </script>
</body>
</html>
