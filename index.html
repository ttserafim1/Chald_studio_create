<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chald Studio Create - Подача заявки</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            animation: fadeIn 1s ease-in;
        }
        .container {
            max-width: 90%;
            margin: 50px auto;
            background: rgba(40, 40, 40, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(0.9);
            animation: popIn 0.5s ease-out forwards;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.3s ease, background 0.3s;
        }
        button:hover {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            transform: scale(1.1);
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            transition: box-shadow 0.3s;
        }
        input:focus, select:focus {
            box-shadow: 0 0 10px rgba(255, 75, 75, 0.8);
            outline: none;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .hidden {
            display: none;
        }
        .visible {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Chald Studio Create</h1>
    <div class="container">
        <h2>Подача заявки</h2>
        <button onclick="toggleForm()">Подать заявку</button>
        <div id="formContainer" class="hidden">
            <form id="applicationForm">
                <label>Ник: <input type="text" id="nickname" required></label>
                <label>Имя: <input type="text" id="name" required></label>
                <label>Возраст: <input type="number" id="age" required></label>
                <label>Тег TG: <input type="text" id="tgTag" required></label>
                <label>Дискорд: <input type="text" id="discord" required></label>
                <label>Опыт в Minecraft (лет): <input type="number" id="experience" required></label>
                <label>Вы играли в другие проекты? 
                    <select id="pastProjects">
                        <option value="Нет">Нет</option>
                        <option value="Да">Да</option>
                    </select>
                </label>
                <label>Какие моды вам интересны? <input type="text" id="favoriteMods"></label>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
    <script>
        function toggleForm() {
            let form = document.getElementById('formContainer');
            form.classList.toggle('hidden');
            form.classList.toggle('visible');
        }
        
        document.getElementById('applicationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let nickname = document.getElementById('nickname').value.replace(/_/g, '\\_');
            let name = document.getElementById('name').value.replace(/_/g, '\\_');
            let age = document.getElementById('age').value;
            let tgTag = document.getElementById('tgTag').value.replace(/_/g, '\\_');
            let discord = document.getElementById('discord').value.replace(/_/g, '\\_');
            let experience = document.getElementById('experience').value;
            let pastProjects = document.getElementById('pastProjects').value;
            let favoriteMods = document.getElementById('favoriteMods').value.replace(/_/g, '\\_');
            
            let botToken = "YOUR_BOT_TOKEN";
            let chatId = "YOUR_CHAT_ID";
            let message = `📩 *Новая заявка на Chald Studio Create*\n\n👤 *Ник:* ${nickname}\n📛 *Имя:* ${name}\n🎂 *Возраст:* ${age}\n📱 *Telegram:* @${tgTag}\n🎧 *Discord:* ${discord}\n🎮 *Опыт в Minecraft:* ${experience} лет\n🏗 *Играл в другие проекты:* ${pastProjects}\n⚙ *Интересные моды:* ${favoriteMods}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: "Markdown" })
            }).then(() => {
                alert('Заявка отправлена!');
            });
        });
    </script>
</body>
</html>
