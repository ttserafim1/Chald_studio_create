<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chald Studio Create - Подача заявки</title>
    <style>
        body {
            background: #121212;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        button {
            background: #6200ea;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #3700b3;
        }
        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }
        .hidden {
            display: none;
        }
        .admin-panel {
            display: none;
            background: rgba(50, 50, 50, 0.9);
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }
        video {
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .admin-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #1e1e1e;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Chald Studio Create</h1>
    <div class="container">
        <h2>Подача заявки</h2>
        <button onclick="toggleForm()">Подать заявку</button>
        <div id="formContainer" class="hidden">
            <form id="applicationForm">
                <label>Ник: <input type="text" id="nickname" required></label><br>
                <label>Имя: <input type="text" id="name" required></label><br>
                <label>Возраст: <input type="number" id="age" required></label><br>
                <label>Тег TG: <input type="text" id="tgTag" required></label><br>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
    <div class="container">
        <h2>Видео</h2>
        <div id="videoList"></div>
    </div>
    <button onclick="showLoginModal()" class="admin-button">Войти как администратор</button>
    <div id="adminPanel" class="admin-panel">
        <h2>Админ-панель</h2>
        <h3>Заявки</h3>
        <div id="applications"></div>
    </div>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Вход</h2>
            <label>Логин: <input type="text" id="adminLogin"></label><br>
            <label>Пароль: <input type="password" id="adminPassword"></label><br>
            <button onclick="adminLogin()">Войти</button>
        </div>
    </div>
    <script>
        function toggleForm() {
            document.getElementById('formContainer').classList.toggle('hidden');
        }
        function showLoginModal() {
            document.getElementById('loginModal').style.display = 'block';
        }
        function adminLogin() {
            let login = document.getElementById('adminLogin').value;
            let password = document.getElementById('adminPassword').value;
            if (login === "tt_serafim_1" && password === "cat201376") {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('loginModal').style.display = 'none';
                loadVideos();
            } else {
                alert("Неверные данные");
            }
        }
        function loadVideos() {
            fetch('video_list.json')
                .then(response => response.json())
                .then(data => {
                    let videoList = document.getElementById('videoList');
                    videoList.innerHTML = '';
                    data.forEach(video => {
                        let videoElement = document.createElement('div');
                        videoElement.innerHTML = `
                            <video controls width="100%">
                                <source src="video/${video}" type="video/mp4">
                                Ваш браузер не поддерживает видео.
                            </video>
                        `;
                        videoList.appendChild(videoElement);
                    });
                });
        }
        document.addEventListener("DOMContentLoaded", loadVideos);
    </script>
</body>
</html>
