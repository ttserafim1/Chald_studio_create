<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chald Studio Create - Подача заявки</title>
    <style>
        body {
            background: #181818;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            animation: fadeIn 1s ease-in;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(40, 40, 40, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(0.9);
            animation: popIn 0.5s ease-out forwards;
        }
        button {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover {
            background: linear-gradient(45deg, #2575fc, #6a11cb);
            transform: scale(1.05);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            transition: box-shadow 0.3s;
        }
        input:focus {
            box-shadow: 0 0 10px rgba(98, 0, 234, 0.8);
            outline: none;
        }
        .hidden {
            display: none;
            opacity: 0;
            transform: translateY(-20px);
            animation: slideDown 0.5s ease-out forwards;
        }
        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.2);
            animation: fadeIn 1s ease-in;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>Chald Studio Create</h1>
    <div class="container">
        <h2>Подача заявки</h2>
        <button onclick="toggleForm()">Подать заявку</button>
        <div id="formContainer" class="hidden">
            <form id="applicationForm">
                <label>Ник: <input type="text" id="nickname" required></label><br>
                <label>Имя: <input type="text" id="name" required></label><br>
                <label>Возраст: <input type="number" id="age" required></label><br>
                <label>Тег TG: <input type="text" id="tgTag" required></label><br>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
    <script>
        function toggleForm() {
            let form = document.getElementById('formContainer');
            form.classList.toggle('hidden');
        }
        
        document.getElementById('applicationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let nickname = document.getElementById('nickname').value;
            let name = document.getElementById('name').value;
            let age = document.getElementById('age').value;
            let tgTag = document.getElementById('tgTag').value;
            
            let botToken = "7776157593:AAFaX3wQXT5gdSN2PgyklNe4NcLcArUuG8s";
            let chatId = "6962439559";
            let message = `📩 *Новая заявка на Chald Studio Create*\n\n👤 *Ник:* ${nickname}\n📛 *Имя:* ${name}\n🎂 *Возраст:* ${age}\n📱 *Telegram:* @${tgTag}`;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: "Markdown" })
            }).then(() => alert('Заявка отправлена!'));
        });
    </script>
</body>
</html>
