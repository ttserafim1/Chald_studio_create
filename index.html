<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chald Studio Create</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 14px;
            text-align: left;
        }

        input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #252525;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        button {
            padding: 12px;
            background: linear-gradient(45deg, #4caf50, #2e7d32);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Chald Studio Create</h1>
        </header>
        
        <button id="toggleForm">Подать заявку</button>
        
        <div id="formContainer" class="hidden">
            <h2>Форма заявки</h2>
            <form id="applicationForm">
                <label for="nickname">Ваш ник:</label>
                <input type="text" id="nickname" name="nickname" required>

                <label for="name">Ваше имя:</label>
                <input type="text" id="name" name="name" required>

                <label for="age">Ваш возраст:</label>
                <input type="number" id="age" name="age" required>
                
                <label for="telegram">Ваш телеграм тег (@username):</label>
                <input type="text" id="telegram" name="telegram" required>
                
                <label for="about">Расскажите о себе:</label>
                <input type="text" id="about" name="about" required>

                <button type="submit">Отправить заявку</button>
            </form>
            <div id="responseMessage"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('toggleForm').addEventListener('click', function() {
            document.getElementById('formContainer').classList.toggle('hidden');
        });

        document.getElementById('applicationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch('https://твой-сервер.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('responseMessage').innerText = data.message;
            });
        });
    </script>
</body>
</html>
